<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>OT Calculator</title>
</head>
<body>
  <div class="popup">

    <!-- HEADER WITH LOGO -->
    <div class="header">
      <img src="icons/icon128.png" alt="Logo" class="logo" />
      <div class="header-text">
        <div class="title">&#1601;&#1604;&#1608;&#1587;&#1606;&#1575; &#1601;&#1610;&#1606; &#1610;&#1608;&#1604;&#1575;&#1583; &#1575;&#1604;</div>
        <div class="subtitle">OT Calculator</div>
      </div>
    </div>

    <div id="weekRange" class="week-range"></div>

    <div id="results" class="results">
      <div class="loading" id="loading">Scanning schedule...</div>
    </div>

    <div class="divider"></div>

    <div class="settings">
      <div class="settings-title">Settings</div>
      <div class="field">
        <label for="hourlyRate">Hourly Rate (EGP)</label>
        <div class="input-wrap">
          <span class="prefix">EGP</span>
          <input type="number" id="hourlyRate" min="0" step="0.01" value="50" />
        </div>
      </div>
      <button id="saveBtn">Save & Recalculate</button>
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- FOOTER -->
    <div class="footer">Open the NICE WFM weekly schedule, then click this icon.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
