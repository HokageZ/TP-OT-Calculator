<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>!!! ابي فلوسي تستهبلون</title>
</head>
<body>
  <div class="popup">

    <!-- HEADER WITH LOGO -->
    <div class="header">
      <img src="icons/icon128.png" alt="Logo" class="logo" />
      <div class="header-text">
        <div class="title">!!! &#1575;&#1576;&#1610; &#1601;&#1604;&#1608;&#1587;&#1610; &#1578;&#1587;&#1578;&#1607;&#1576;&#1604;&#1608;&#1606;</div>
        <div class="subtitle">OT Calculator</div>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Popup Sections">
      <button id="resultsTabBtn" class="tab-btn active" type="button" data-tab="resultsTab">Results</button>
      <button id="settingsTabBtn" class="tab-btn" type="button" data-tab="settingsTab">Settings</button>
    </div>

    <div id="resultsTab" class="tab-panel active">
      <!-- STATUS / WEEK RANGE -->
      <div id="weekRange" class="week-range"></div>

      <!-- RESULTS AREA -->
      <div id="results" class="results">
        <div class="loading" id="loading">Scanning schedule...</div>
      </div>
    </div>

    <div id="settingsTab" class="tab-panel">
      <div class="divider"></div>

      <!-- SETTINGS -->
      <div class="settings">
        <div class="settings-title">Settings</div>
        <div class="field">
          <label for="hourlyRate">Hourly Rate (EGP)</label>
          <div class="input-wrap">
            <span class="prefix">EGP</span>
            <input type="number" id="hourlyRate" min="0" step="0.01" value="50" />
          </div>
        </div>
        <div class="field">
          <label for="weekStart">Week Starts On</label>
          <div class="select-wrap">
            <select id="weekStart">
              <option value="Sun">Sunday</option>
              <option value="Mon">Monday</option>
              <option value="Tue">Tuesday</option>
              <option value="Wed">Wednesday</option>
              <option value="Thu">Thursday</option>
              <option value="Fri">Friday</option>
              <option value="Sat">Saturday</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="bonusThreshold">Bonus Threshold (hrs)</label>
          <div class="input-wrap">
            <input type="number" id="bonusThreshold" min="1" step="1" value="9" />
          </div>
        </div>
        <div class="field">
          <label for="bonusAmount">Bonus Amount (hrs)</label>
          <div class="input-wrap">
            <input type="number" id="bonusAmount" min="0.01" step="0.01" value="1" />
          </div>
        </div>
        <button id="saveBtn">Save & Recalculate</button>
        <div id="statusMsg" class="status-msg"></div>

        <div class="divider" style="margin: 16px 0;"></div>
        <div class="settings-title">Updates</div>
        <div class="field" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-size:11px; font-weight:600; color:#777;">Version</span>
          <span id="extVersion" style="font-weight:700; color:#1a1a2e;">1.0.0</span>
        </div>
        <button id="checkUpdateBtn" style="width:100%; background:#f4f6f9; color:#1a1a2e; border:1.5px solid #d5dae0; padding:8px 0; border-radius:5px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; transition:background 0.2s;">Check for Updates</button>
        <div id="updateStatusMsg" class="status-msg"></div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">Open the NICE WFM weekly schedule, then click this icon.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
